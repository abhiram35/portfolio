name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Project sites live at https://<user>.github.io/<repo>/ so assets need that base path.
      # If this repo is <user>.github.io, change BASE_PATH to "/".
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # URL of the deployed API (Settings → Secrets and variables → Actions → Variables).
          # If unset, the contact form falls back to opening the visitor's email app.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
